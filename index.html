if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    regs.forEach(function (r) { r.unregister(); });
  }).catch(function () {});

    caches.keys().then(function (nomes) { nomes.forEach(function (n) { caches.delete(n); }); }).catch(function () {});
  }

<script>
function mostrarFalha(detalhe) {
  var raiz = document.getElementById('root');
  if (raiz && !raiz.hasChildNodes()) {
    raiz.innerHTML = '<div style="padding:24px;text-align:center;font-family:Trebuchet MS,sans-serif;color:#073B4C;max-width:420px;margin:0 auto">' +
      '<div style="font-size:40px">⚓😕</div>' +
      '<div style="font-weight:900;font-size:17px;margin-top:8px">Deu um erro ao abrir o app</div>' +
      '<div style="font-size:13px;color:#5a7684;margin-top:10px;line-height:1.5">Tire um print desta tela inteira (com essa mensagem) e mande pra quem está te ajudando a consertar:</div>' +
      '<div style="background:#FFE3EA;color:#B00030;border-radius:10px;padding:10px;margin-top:10px;font-size:12px;text-align:left;word-break:break-all;font-family:monospace">' + (detalhe || 'erro desconhecido') + '</div>' +
      '</div>';
  }
}
window.addEventListener('error', function (e) { mostrarFalha((e && e.message) || 'erro sem mensagem'); });
window.addEventListener('unhandledrejection', function (e) { mostrarFalha('promessa rejeitada: ' + ((e && e.reason && e.reason.message) || e.reason || '?')); });
</script>

dth:4}),t.default.createElement("text",{x:"88",y:"120",...r},"anzol de leve, perto do rabo \u2014 ele continua nadando!")):null}var wi={molinete:{nome:"Molinete",emoji:"\u{1F300}",cor:"#118AB2",intro:"O molinete \xE9 o melhor amigo de quem est\xE1 come\xE7ando: \xE9 f\xE1cil de arremessar e quase n\xE3o embola a linha.",passos:[{t:"Conhe\xE7a as partes",d:"O molinete fica embaixo da vara. Ele tem a manivela (para recolher), o bail (o arco de metal que abre e fecha) e o freio (a rosca na frente)."},{t:"Regule o freio",d:"Pe\xE7a para algu\xE9m puxar a linha: ela deve sair com um pouco de for\xE7a, nem travada nem solta demais. Isso cansa o peixe sem arrebentar a linha."},{t:"Prepare o arremesso",d:"Segure a linha com o dedo indicador, abra o bail (o arco de metal) e deixe a isca pendurada uns 20 cm da ponta da vara."},{t:"Arremesse!",d:"Leve a vara para tr\xE1s por cima do ombro, jogue para frente e solte o dedo da linha quando a vara apontar para onde voc\xEA quer. Olhe para tr\xE1s antes: ningu\xE9m pode estar perto!"},{t:"Feche o bail e recolha",d:"Depois que a isca cair na \xE1gua, feche o bail com a m\xE3o (n\xE3o s\xF3 girando a manivela) e recolha a folga da linha."},{t:"Fisgou? Calma!",d:"Levante a vara com firmeza para fisgar e recolha girando a manivela sem pressa. Se o peixe puxar forte, deixe o freio trabalhar."},{t:"As 3 formas de lan\xE7ar",d:"LAN\xC7AMENTO POR CIMA (o cl\xE1ssico): vara por tr\xE1s do ombro, movimento para frente, solta a linha quando a vara aponta pra onde quer. LAN\xC7AMENTO LATERAL: a vara vai de lado (como um golpe de espada) \u2014 \xF3timo em lugares apertados como trapiche com teto ou vento forte de frente. LAN\xC7AMENTO POR BAIXO (pendular): a isca balan\xE7a pendurada e voc\xEA solta com um movimento suave para cima \u2014 perfeito para dist\xE2ncias curtas, tipo pescar bem na beirada do trapiche sem espa\xE7o atr\xE1s."}]},carretilha:{nome:"Carretilha",emoji:"\u2699\uFE0F",cor:"#073B4C",intro:"A carretilha fica em cima da vara e d\xE1 mais precis\xE3o, mas precisa de treino para a linha n\xE3o embolar (a famosa cabeleira!).",passos:[{t:"Regule os freios primeiro",d:"Coloque o freio magn\xE9tico (bot\xE3o do lado) quase no m\xE1ximo. No freio mec\xE2nico (perto da manivela), aperte at\xE9 a isca descer devagarinho quando voc\xEA solta o bot\xE3o."},{t:"Teste da queda",d:"Aperte o bot\xE3o de arremesso: a isca deve descer lenta e o carretel deve PARAR sozinho quando ela chega no ch\xE3o. Se continuar girando, aperte mais o freio."},{t:"Posi\xE7\xE3o do polegar",d:"Seu polegar fica sempre encostadinho no carretel. Ele \xE9 o seu 'freio de emerg\xEAncia' durante o voo da isca."},{t:"Arremesso curto",d:"Fa\xE7a um movimento de punho, suave, soltando o polegar quando a vara aponta para frente. Comece com arremessos curtos no quintal, usando um peso sem anzol."},{t:"Freie na hora certa",d:"Quando a isca estiver quase caindo na \xE1gua, encoste o polegar no carretel para par\xE1-lo. Isso evita a cabeleira!"},{t:"Evolua aos poucos",d:"Conforme for acertando, v\xE1 soltando o freio magn\xE9tico aos pouquinhos para arremessar mais longe."},{t:"Lan\xE7amentos com carretilha",d:"LAN\xC7AMENTO POR CIMA: igual ao molinete, o mais usado e mais f\xE1cil de controlar com o polegar. LAN\xC7AMENTO LATERAL (sidearm): \xFAtil com vento forte vindo de frente \u2014 a isca voa mais baixo. LAN\xC7AMENTO EM ARCO/PENDULAR: para curtas dist\xE2ncias de trapiche ou barco, um movimento suave de baixo pra cima, sempre com o polegar pronto para frear."}]},tarrafa:{nome:"Tarrafa",emoji:"\u{1F578}\uFE0F",cor:"#06D6A0",intro:"A tarrafa \xE9 a rede redonda usada para pegar tainha e camar\xE3o. \xC9 tradi\xE7\xE3o em Floripa! Precisa de licen\xE7a e das regras da \xE9poca \u2014 sempre com um adulto.",passos:[{t:"Conhe\xE7a a tarrafa",d:"Ela tem a corda (que fica presa no seu pulso), a rede em formato de sino e as chumbadas na borda, que fazem ela afundar aberta."},{t:"Prenda a corda",d:"Enrole a ponta da corda no pulso e recolha o resto em voltas na m\xE3o. Assim a tarrafa nunca vai embora com a \xE1gua."},{t:"Arrume a rede",d:t.default.createElement(t.default.Fragment,null,"Segure a tarrafa pelo meio, separe uma parte da borda com chumbo na outra m\xE3o e um peda\xE7o pode ir apoiado no ombro ou no bra\xE7o (jeito manezinho!). Na pesca de verdade da tainha, quem fica no morro vigiando o cardume \xE9 ",t.default.createElement(Vi,{culta:"o vigia",manez:"o olheiro"}),", e toda ",t.default.createElement(Vi,{culta:"a equipe de pescadores",manez:"a companha"})," trabalha junto no cerco.")},{t:"O giro",d:"Gire o corpo para tr\xE1s e lance girando para frente, soltando as duas m\xE3os juntas. A rede deve abrir como uma pizza no ar."},{t:"Deixe afundar e puxe",d:"As chumbadas afundam e prendem os peixes embaixo. Puxe a corda devagar: a rede vai fechando como um saquinho."},{t:"Treine em terra",d:"Treine a abertura na grama ou na areia antes de ir para a \xE1gua. Contar quantas vezes ela abre redondinha vira brincadeira!"}]},historia:{nome:"Hist\xF3ria da Pesca da Ilha",emoji:"\u{1F3DB}\uFE0F",cor:"#8A6D00",intro:"Antes de existir molinete, antes at\xE9 de existir Floripa, j\xE1 tinha gente pescando aqui. Vamos conhecer essa hist\xF3ria?",passos:[{t:"Os construtores de sambaqui",d:"Os primeiros moradores da Ilha, h\xE1 uns 6.000 anos, comiam tanto marisco e peixe que deixaram montanhas inteiras de conchas empilhadas \u2014 os sambaquis. Eles viveram aqui por milhares de anos, at\xE9 uns 2.000 anos atr\xE1s."},{t:"Os guaranis (carij\xF3s)",d:"Por volta do ano 1.400, os guaranis chegaram vindos de longe, em canoas de um tronco s\xF3, navegando pelos rios. Aprenderam a pescar e colher marisco na Ilha, at\xE9 serem expulsos pelos bandeirantes no s\xE9culo XVI."},{t:"Os a\xE7orianos e a Ilha vira Floripa",d:"No s\xE9culo XVIII, a Coroa portuguesa trouxe cerca de 6 mil colonos dos A\xE7ores e da Madeira para povoar a Ilha. Eles logo descobriram: pescar aqui dava comida e dinheiro! No come\xE7o, a pesca da BALEIA (para tirar \xF3leo, usado para iluminar) foi o grande neg\xF3cio."},{t:"'Mar de dentro' e 'mar de fora'",d:"Os pescadores antigos separavam o mundo em dois: o 'mar de dentro' (as ba\xEDas Norte e Sul, \xE1gua calma, entre a Ilha e o continente) e o 'mar de fora' (o oceano aberto, na costa leste). Cada um pede um jeito diferente de pescar \u2014 e at\xE9 o jeito de ser dos pescadores era diferente entre um lado e outro!"},{t:"Um patrim\xF4nio que quase se perdeu",d:"A pesca artesanal da Ba\xEDa Sul \xE9 tradi\xE7\xE3o de mais de 250 anos, passada de pescador experiente para o mais novo, s\xF3 de olho e de ouvido \u2014 sem escola, sem livro. Pesquisadores da UFSC consideram isso um verdadeiro Patrim\xF4nio Cultural Imaterial da Ilha, do mesmo jeito que o samba de roda ou a arte dos repentistas."},{t:"Por que aprender isso importa",d:"Cada vez tem menos gente vivendo s\xF3 da pesca artesanal na Ilha. Quando voc\xEAs aprendem um n\xF3, uma isca, o jeito de ler a mar\xE9... voc\xEAs est\xE3o guardando viva uma cultura de s\xE9culos. Parab\xE9ns por serem parte dessa hist\xF3ria! \u{1F3A3}"}]},tecnicas_tradicionais:{nome:"Caceio, Volta e Fundeio: as t\xE9cnicas de verdade",emoji:"\u{1F578}\uFE0F",cor:"#118AB2",intro:"Os pescadores profissionais da Ilha usam nomes e t\xE9cnicas pr\xF3prias, passadas de pai para filho. Conhe\xE7a as principais \u2014 algumas usam rede, ent\xE3o s\xE3o trabalho de adulto, mas todo pescador de vara deveria conhecer!",passos:[{t:"Caceio: a rede que anda com a mar\xE9",d:"No caceio, o pescador solta a rede esticada e deixa a MAR\xC9 carregar ela, pegando os peixes que passam no caminho. Por isso s\xF3 funciona bem em lua cheia ou nova, quando a mar\xE9 \xE9 mais forte (siz\xEDgia) \u2014 'mar\xE9 parada n\xE3o mata', dizem os pescadores antigos!"},{t:"Volta (ou cerco): cercando o cardume",d:"Na volta, o barco faz um c\xEDrculo inteiro em volta do cardume com a rede, fechando a sa\xEDda. Diferente do caceio, aqui a mar\xE9 atrapalha: se n\xE3o souber a dire\xE7\xE3o certa, a rede pode ir parar em cima de uma pedra e rasgar!"},{t:"Batuque: fazendo barulho para pescar",d:"\xC9 uma volta em que o barco fica DENTRO do c\xEDrculo de rede, e os pescadores batem uma vara na \xE1gua (pau, pau, pau!) para espantar os peixes na dire\xE7\xE3o da rede. Peixe enterrado na areia fria \xE0s vezes nem sai do lugar \u2014 s\xF3 o barulho o assusta para fora!"},{t:"Fundeio: a mais simples de todas",d:"A rede fica esticada e presa com \xE2ncoras dos dois lados, parada a noite toda, pegando o que passar por ali (peixe 'emalhado', preso pelas guelras). \xC9 f\xE1cil de fazer, mas arriscada: fica a noite inteira sem vigil\xE2ncia e pode at\xE9 ser roubada!"},{t:"As redes de espera (emalhe)",d:"\xC9 o tipo de pesca mais usado em toda Santa Catarina! A REDE FIXA (ou 'manjoada') fica ancorada da noite para o dia. A REDE FEITICEIRA (ou tresmalho) tem TR\xCAS panos de rede juntos \u2014 dois de malha grande por fora, um fino no meio \u2014 pega peixe de v\xE1rios tamanhos."},{t:"Zangarilho: pescando lula com luz",d:"\xC0 noite, o pescador acende um holofote apontado para a \xE1gua \u2014 as lulas v\xEAm atra\xEDdas pela luz! O zangarilho \xE9 um pesinho com uma coroa de anz\xF3is sem farpa ao redor; sobe e desce a linha, e a lula curiosa se enrosca nos a\xE7os. \xC9 pesca s\xF3 de ver\xE3o, quando a lula est\xE1 por perto da costa."},{t:"Confec\xE7\xE3o e remendo de rede",d:"Fazer e consertar rede \xE9 arte \xE0 parte! Em algumas comunidades da Ilha, como Ilhas (Ararangu\xE1) e Laguna, pescadores mais velhos, j\xE1 aposentados da \xE1gua, ganham a vida remendando redes rasgadas dos mais jovens \u2014 um trabalho de paci\xEAncia e agulha."}]},colheita_do_mar:{nome:"Berbig\xE3o, Ostra e Marisco: a colheita do mar",emoji:"\u{1F41A}",cor:"#06D6A0",intro:"Nem toda pesca usa anzol! Na Ilha tamb\xE9m se colhe o mar com as pr\xF3prias m\xE3os \u2014 uma tradi\xE7\xE3o t\xE3o antiga quanto os sambaquis.",passos:[{t:"Berbig\xE3o: o marisco mais querido da Ilha",d:"O berbig\xE3o \xE9 um mariscozinho que vive enterrado na areia molhada de baixios (lugares rasos). Vira caldo e pastel nas mesas de Floripa! Antigamente, mulheres e crian\xE7as colhiam com a m\xE3o nos dias de vento sul, quando n\xE3o dava para pescar no mar."},{t:"O gancho (ou rastelo)",d:"Hoje o berbig\xE3o \xE9 colhido com o gancho: uma gaiola de metal presa a um cabo comprido, parecida com um ancinho gigante \u2014 pesa uns 20 kg! \xC9 preciso bastante for\xE7a para puxar pela areia."},{t:"A Reserva do Pirajuba\xE9",d:"Por causa do berbig\xE3o, o Brasil ganhou em 1992 a primeira Reserva Extrativista MARINHA do pa\xEDs \u2014 a Resex do Pirajuba\xE9, no estu\xE1rio do Rio Tavares, em Floripa. L\xE1 existe at\xE9 um ROD\xCDZIO: cada \xE1rea s\xF3 pode ser colhida em certos dias, para o berbig\xE3o sempre ter tempo de se recuperar. Ci\xEAncia e tradi\xE7\xE3o trabalhando juntas!"},{t:"Ostra do mangue e mariscos",d:"Nas ra\xEDzes das \xE1rvores de mangue grudam ostras nativas, colhidas com uma foice adaptada, deixando as sementinhas no lugar para crescerem outras. J\xE1 o sururu e o bacucu (tipos de mexilh\xE3o) s\xE3o catados com a m\xE3o ou uma pazinha no barro do mangue."},{t:"Marisco de praia (massambique)",d:"Nas praias abertas do sul de Santa Catarina, moluscos como o massambique vivem enterrados na areia da beira da \xE1gua, cavando r\xE1pido com um 'pezinho' forte assim que a onda baixa. S\xE3o colhidos s\xF3 com a m\xE3o, sem prejudicar os bancos naturais."},{t:"Caranguejo: tamb\xE9m tem seu defeso",d:"No ver\xE3o, os caranguejos saem das tocas para se acasalar \u2014 hora perfeita para o pescador, mas tamb\xE9m hora de ter cuidado: existe um per\xEDodo de defeso (proibido pescar) para eles poderem se reproduzir em paz, igual acontece com os peixes."}]},agua_doce:{nome:"\xC1gua doce: rio, lago e cachoeira",emoji:"\u{1F3DE}\uFE0F",cor:"#06D6A0",intro:"Nem tudo que funciona no mar funciona no rio! Aqui v\xE3o as diferen\xE7as e os macetes da pescaria de \xE1gua doce.",passos:[{t:"O que muda em rela\xE7\xE3o ao mar",d:"A maior diferen\xE7a: RIO E LAGO N\xC3O T\xCAM MAR\xC9. Esque\xE7a aquela parte do Pesc\xF4metro. Mas a Lua, a press\xE3o do ar, o vento e o hor\xE1rio (amanhecer/entardecer) continuam valendo do mesmo jeito \u2014 os peixes de \xE1gua doce tamb\xE9m sentem tudo isso!"},{t:"A correnteza do rio \xE9 a 'mar\xE9' de \xE1gua doce",d:"Em vez de mar\xE9, o rio tem a CORRENTEZA. Peixe fica de olho em redemoinhos, atr\xE1s de pedras e troncos (onde a \xE1gua corre mais devagar) \u2014 \xE9 ali que ele economiza energia esperando a comida passar. Depois de chuva forte, o rio sobe e fica barrento: espere a \xE1gua clarear um pouco antes de ir."},{t:"Cachoeira: o po\xE7o \xE9 o point",d:"Embaixo da queda d'\xE1gua, a correnteza mistura muito oxig\xEAnio na \xE1gua \u2014 os peixes adoram essa zona (chamada de 'po\xE7o'). Jogue a isca na beirada do po\xE7o, n\xE3o direto na queda. E cuidado redobrado: pedra de cachoeira \xE9 muito escorregadia, sempre com adulto e longe da beirada da queda."},{t:"Lagoa: \xE1gua paradinha, jeito diferente",d:"Sem correnteza nenhuma, o peixe de lagoa fica perto de plantas aqu\xE1ticas, troncos ca\xEDdos e sombra da margem \u2014 ali ele se esconde e ca\xE7a. Nos dias quentes, a \xE1gua da superf\xEDcie esquenta r\xE1pido; procure lugares mais fundos ou com sombra no calor do meio-dia."},{t:"Iscas campe\xE3s de \xE1gua doce",d:"MINHOCA e MASSA (bolinha de p\xE3o) resolvem quase tudo. Milho em gr\xE3o \xE9 \xF3timo para carpa, pacu e tambaqui. Peixinho vivo pequeno atrai tra\xEDra e jundi\xE1. Isca artificial tipo colher ou shad funciona muito bem em tra\xEDra e truta."},{t:"Equipamento mais leve",d:"Na \xE1gua doce, geralmente d\xE1 para usar linha mais fina e vara mais leve que no mar \u2014 os peixes costumam ser menores (com exce\xE7\xE3o do tambaqui, que puxa forte!). Bom lugar para come\xE7ar com molinete pequeno."},{t:"Cuidados extras da \xE1gua doce",d:"Fique de olho no N\xCDVEL DO RIO \u2014 ele pode subir r\xE1pido depois de chuva na cabeceira, mesmo com sol onde voc\xEAs est\xE3o! Em cachoeira, nunca subir em pedras molhadas. E lembrem: muitas esp\xE9cies de \xE1gua doce t\xEAm regras pr\xF3prias (tamanho, \xE9poca) que variam bastante \u2014 sempre bom perguntar na regi\xE3o ou com um \xF3rg\xE3o ambiental."}]},pesque_pague:{nome:"Pesque-pague: regras e dicas",emoji:"\u{1F3AB}",cor:"#F78C6B",intro:"Pesque-pague \xE9 \xF3timo para come\xE7ar: peixe garantido, ambiente tranquilo e regras mais simples. Mas CADA lugar tem as pr\xF3prias regras \u2014 confirmem sempre na portaria antes de montar a vara!",passos:[{t:"Como funciona, geralmente",d:"A maioria cobra de duas formas: por QUILO pescado (voc\xEA paga o peso do que levar) ou por ENTRADA fixa (paga para entrar e pesca \xE0 vontade, \xE0s vezes com limite). Muitos t\xEAm desconto para crian\xE7as. Pergunte na entrada qual \xE9 o sistema do dia!"},{t:"Tipo de anzol mais comum",d:"Muitos pesque-pagues pedem anzol SIMPLES e SEM FISGA (sem a farpinha que trava), porque solta mais f\xE1cil e machuca menos o peixe \u2014 importante nesse tipo de pescaria por causa da quantidade de gente pescando no mesmo tanque. Se n\xE3o tiverem certeza, perguntem no local."},{t:"Isca permitida",d:"Isca de MASSA (p\xE3o, milho, ra\xE7\xE3o) costuma ser sempre liberada, e muitas vezes vendida no pr\xF3prio local. Minhoca geralmente tamb\xE9m \xE9 aceita. J\xE1 isca viva de PEIXE costuma ser proibida na maioria dos lugares, para n\xE3o misturar esp\xE9cies entre os tanques \u2014 sempre confirme antes."},{t:"Peixes mais comuns no pesque-pague",d:"Til\xE1pia, carpa, pacu e tambaqui s\xE3o os mais criados nesse tipo de pescaria. Em regi\xF5es mais frias e altas de Santa Catarina, existem pesque-pagues especializados em TRUTA, peixe que s\xF3 vive em \xE1gua bem gelada."},{t:"O que geralmente N\xC3O \xE9 permitido",d:"Na maioria dos pesque-pagues, o peixe que voc\xEA fisga \xE9 o peixe que voc\xEA leva/paga \u2014 devolver nem sempre \xE9 permitido (\xE9 diferente da pesca esportiva no mar ou no rio). Tamb\xE9m costuma ter limite de varas por pessoa. Sempre existe um hor\xE1rio de funcionamento \u2014 confiram antes de planejar o dia."},{t:"Boas maneiras no pesque-pague",d:"Respeite o espa\xE7o do vizinho de tanque, n\xE3o estique a linha por cima da vara de outra pessoa, e devolva os equipamentos emprestados limpos. \xC9 um \xF3timo lugar para treinar o que aprenderam no app antes de encarar o mar ou o rio de verdade!"}]},armadilha:{nome:"Armadilhas (covo e coca)",emoji:"\u{1FAA4}",cor:"#F78C6B",intro:"Armadilha \xE9 pesca de paci\xEAncia: voc\xEA arma, espera e confere. Cada tipo tem seu truque \u2014 e suas regras!",passos:[{t:"Covo: a casa de entrada sem sa\xEDda",art:"covo",d:"\xC9 a armadilha fechada de rede com entradas nas laterais (a sua tem 6 buracos, e a outra fecha com z\xEDper). As entradas s\xE3o funis: f\xE1ceis de entrar nadando, dif\xEDceis de achar a sa\xEDda. O peixe entra atr\xE1s do cheiro da isca e fica hospedado at\xE9 voc\xEA buscar."},{t:"A isca vai no meio",d:"Prenda sardinha, fil\xE9 ou restos de peixe bem no centro (num ganchinho ou saquinho de rede). Quanto mais cheirosa, melhor! Feche bem o z\xEDper ou a abertura \u2014 se ficar frouxo, o h\xF3spede vai embora."},{t:"Coca: o elevador de siri",art:"coca",d:"A coca \xE9 o arco com rede frouxa e a isca amarrada no fundo. O siri sente o cheiro, sobe na rede e come\xE7a a comer. A\xED vem o truque: puxe a corda R\xC1PIDO e reto para cima \u2014 a rede vira um saco e o siri n\xE3o escapa. Espere uns 5-10 minutos entre cada puxada."},{t:"Onde e como armar",d:"Trapiche, canal e cost\xE3o calmo s\xE3o \xF3timos. Amarre a corda num ponto firme (e com n\xF3 bom \u2014 olha o guia de n\xF3s!) e deixe uma boia ou marca para lembrar onde est\xE1. Pense na mar\xE9: em \xE1gua muito rasa na vazante, a armadilha pode ficar no seco."},{t:"Cuidado com o baiacu! \u{1F421}",d:"O baiacu ADORA entrar em armadilha. Ele \xE9 fofo e engra\xE7ado quando incha, mas aten\xE7\xE3o: baiacu N\xC3O se come \u2014 o corpo dele tem um veneno perigoso de verdade. Devolva com cuidado, sem apertar, de prefer\xEAncia com o adulto usando um pano ou alicate."},{t:"Regras e respeito",d:"Armadilha tem regras pr\xF3prias na pesca amadora (tipo, tamanho e quantidade permitida mudam conforme a norma). Pe\xE7a para um adulto conferir as regras atuais antes de armar. E nunca abandone uma armadilha no mar \u2014 ela continua pescando sozinha para sempre, e isso machuca a natureza."},{t:"Bernun\xE7a: o al\xE7ap\xE3o que virou brincadeira",d:"Na Lagoa da Concei\xE7\xE3o existe uma armadilha de camar\xE3o bem diferente: a bernun\xE7a, parecida com um al\xE7ap\xE3o de aba m\xF3vel que fecha r\xE1pido sobre a presa. O nome vem direto do Boi de Mam\xE3o, brincadeira tradicional de Floripa: a Bernun\xE7a \xE9 um bicho de boca enorme que 'engole' as crian\xE7as na festa e depois cospe uma bernuncinha! O jeito de abrir e fechar a boca do bicho \xE9 igualzinho ao da armadilha."},{t:"Espinhel de siri",d:"\xC9 uma linha comprida (\xE0s vezes mais de 500 metros!) com iscas de carne amarradas de trecho em trecho. O pescador solta no fundo e espera o siri agarrar a isca com a pin\xE7a. Na volta, puxa a linha devagar com o barco andando e vai catando os siris com uma redinha, tipo uma raquete."}]}},kf={limpeza:{nome:"Limpar e preparar o peixe",emoji:"\u{1F52A}",cor:"#F78C6B",intro:"A pescaria s\xF3 termina na mesa! Limpar e cozinhar juntos \xE9 metade da divers\xE3o \u2014 com as tarefas certas para cada idade.",passos:[{t:"Regra n\xBA 1: a faca \xE9 do adulto",d:"Crian\xE7a participa de MONT\xC3O de coisas: escamar com colher, lavar, temperar, embrulhar. Mas cortar com faca afiada e tirar espinha \xE9 trabalho do adulto. Combinem as tarefas antes de come\xE7ar!"},{t:"Escamar (tarefa de crian\xE7a!)",d:"Segure o peixe pelo rabo e raspe com uma colher (ou escamador) DO RABO PARA A CABE\xC7A, contra as escamas. Fa\xE7a dentro de um saco pl\xE1stico ou debaixo d'\xE1gua \u2014 sen\xE3o a cozinha vira festa de escama voadora! N\xE3o esque\xE7a perto das nadadeiras."},{t:"Limpar por dentro (adulto)",d:"O adulto faz um corte na barriga, do 'bumbum' do peixe at\xE9 perto da cabe\xE7a, retira as v\xEDsceras e as guelras (elas amargam o peixe). Depois a crian\xE7a assume: lavar bem por dentro e por fora em \xE1gua corrente at\xE9 a barriga ficar limpinha."},{t:"Inteiro, em postas ou fil\xE9?",d:"Peixe pequeno (papa-terra, peixe-rei): frito inteiro, fica crocante! Peixe m\xE9dio: em postas (fatias). Peixe grande (tainha, anchova): 'escalado' \u2014 aberto pelas costas como um livro, jeito manezinho de assar. Filetar \xE9 a arte do adulto com faca flex\xEDvel, rente \xE0 espinha."},{t:"Conservar direito",d:"Peixe fresco n\xE3o espera: na praia, caixa com gelo por cima e por baixo. Em casa, geladeira por no m\xE1ximo 2 dias, ou congelado limpo por at\xE9 3 meses. Peixe bom tem olho brilhante, guelra vermelha e cheiro de MAR (n\xE3o de 'peixe velho')."},{t:"Receitas de Floripa \u{1F37D}\uFE0F",d:"TAINHA ASSADA: escalada, sal grosso, na grelha da brasa com a pele para baixo \u2014 a tradi\xE7\xE3o da safra! PEIXE FRITO COM PIR\xC3O: postas passadas na farinha e fritas; com o caldo da cabe\xE7a fa\xE7a pir\xE3o d'\xE1gua mexendo farinha de mandioca. ESCABECHE DE ANCHOVA: frita e depois coberta com cebola, cenoura e vinagre \u2014 dura dias e fica melhor no dia seguinte!"},{t:"Aproveitar tudo, jogar nada",d:"Cabe\xE7a e espinha viram um caldo delicioso (base do pir\xE3o). Restos limpos podem virar isca de armadilha na pr\xF3xima pescaria ou adubo enterrado na horta. E aten\xE7\xE3o: NUNCA jogue restos com anzol ou linha no mar ou na praia \u2014 machuca aves e outros bichos."}]},ciencia:{nome:"Ci\xEAncia da Pesca (por que funciona?)",emoji:"\u{1F9EA}",cor:"#118AB2",intro:"Lua, mar\xE9, press\xE3o e vento est\xE3o todos conectados! Quem entende a ci\xEAncia, pesca melhor.",passos:[{t:"A Lua puxa o mar",d:"A gravidade da Lua puxa a \xE1gua do oceano, criando as mar\xE9s. Na Lua CHEIA e na Lua NOVA, o Sol e a Lua puxam juntos \u2014 as mar\xE9s ficam maiores e mais fortes. Mar\xE9 forte = mais correnteza = mais comida se mexendo = mais peixes ca\xE7ando!"},{t:"Mar\xE9 mexendo = restaurante aberto",d:t.default.createElement(t.default.Fragment,null,'Quando a mar\xE9 enche ou vaza, a correnteza arrasta camar\xF5es, siris e peixinhos. Os peixes grandes ficam esperando essa "esteira de comida" passar. Na mar\xE9 parada (o pico), a esteira desliga e eles descansam. Por isso o Pesc\xF4metro d\xE1 mais pontos com ',t.default.createElement(Vi,{culta:"a mar\xE9 se mexendo",manez:"a mar\xE9 se mechendo"}),"! ",t.default.createElement("span",{style:{fontSize:12,color:"#8aa5b0"}},"(toque na palavra sublinhada)"))},{t:"Press\xE3o CAINDO = banquete!",d:"Os peixes t\xEAm uma bolsa de ar dentro do corpo (a bexiga natat\xF3ria) que sente o peso do ar l\xE1 em cima. Quando a press\xE3o cai, \xE9 sinal de que uma frente fria com chuva est\xE1 chegando \u2014 e os peixes sabem! Eles comem MUITO antes do tempo virar, como quem enche a despensa antes da tempestade."},{t:"Press\xE3o ALTA = peixes pregui\xE7osos",d:"Depois que a frente fria passa, a press\xE3o sobe e o c\xE9u fica azul e limpo. Parece dia perfeito para n\xF3s... mas a bexiga do peixe fica apertada, ele desce para o fundo e come devagar. Nesses dias, use iscas menores, mais lentas e pesque mais fundo."},{t:"Vento: um pouco ajuda, muito atrapalha",d:"Vento fraquinho faz ondinhas que colocam oxig\xEAnio na \xE1gua e escondem voc\xEA dos peixes \u2014 bom! Ventania forte suja a \xE1gua, atrapalha o arremesso e deixa o mar perigoso \u2014 ruim. Em Floripa, vento sul forte geralmente vem com frente fria: mar bravo, fique em casa planejando a pr\xF3xima!"},{t:"Peixe \xE9 'sangue frio'",d:"A temperatura do corpo do peixe \xE9 igual \xE0 da \xE1gua. \xC1gua muito fria = peixe lento, comendo pouco (por isso o inverno pede pesca mais devagar). \xC1gua morna = peixe acelerado. A tainha \xE9 a exce\xE7\xE3o que confirma: ela AMA o inverno e vem em cardumes gigantes \u2014 a famosa safra da tainha!"},{t:"Amanhecer e entardecer: a hora do ataque",d:t.default.createElement(t.default.Fragment,null,"Com pouca luz, os ",t.default.createElement(Vi,{culta:"peixes ca\xE7adores",manez:"peixe de rapina"}),' enxergam melhor que as presas \u2014 \xE9 a vantagem deles! No meio do dia, com sol forte, a presa v\xEA o ca\xE7ador chegando de longe. Por isso os peixes "almo\xE7am" cedinho e "jantam" no fim da tarde.')},{t:"Juntando tudo (o segredo do Pesc\xF4metro)",d:"Dia dos sonhos: lua cheia ou nova + mar\xE9 se mexendo no seu hor\xE1rio + press\xE3o caindo + vento fraco + c\xE9u nublado + amanhecer ou entardecer. \xC9 exatamente essa conta que o Pesc\xF4metro faz por voc\xEAs \u2014 agora voc\xEAs sabem o PORQU\xCA de cada ponto! \u{1F393}"}]},nos:{nome:"N\xF3s de pesca",emoji:"\u{1FAA2}",cor:"#EF476F",intro:"Um n\xF3 bem feito segura o peixe grande. Um n\xF3 mal feito... tchau, peixe! Aprenda os 3 mais importantes.",passos:[{t:"Regra de ouro dos n\xF3s",d:"Antes de apertar QUALQUER n\xF3, molhe ele com \xE1gua (ou saliva). Isso evita que a linha esquente e enfraque\xE7a. E sempre puxe devagar para apertar."},{t:"N\xF3 Clinch \u2014 o cl\xE1ssico do anzol",art:"clinch",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_\xDAnico",label:"Ver no Portal Pesca Amadora (N\xF3 \xDAnico)"},d:'Sigam os 4 quadros acima, um de cada vez \u2014 treinem com um barbante grosso antes de usar linha de pesca de verdade, fica bem mais f\xE1cil de enxergar. Esse n\xF3 tamb\xE9m \xE9 chamado de "N\xF3 \xDAnico" por outros pescadores.'},{t:"N\xF3 Palomar \u2014 o mais f\xE1cil e forte",art:"palomar",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Palomar",label:"Ver no Portal Pesca Amadora"},d:"Este \xE9 o mais f\xE1cil dos tr\xEAs \u2014 sigam os 3 quadros acima com calma. Dica: fa\xE7am o n\xF3 frouxo primeiro (passo 2) e s\xF3 apertem tudo no passo 3, depois de passar por cima do anzol inteiro."},{t:"N\xF3 Uni \u2014 o coringa",art:"uni",video:"n\xF3 uni pesca passo a passo",d:"Sigam os 3 quadros acima. Esse n\xF3 serve para anzol, girador e at\xE9 para emendar duas linhas (fazendo um Uni em cada ponta e puxando as duas)."},{t:"Desafio do mestre dos n\xF3s",d:"Treine em casa com barbante grosso e um clipe de papel como 'anzol' \u2014 \xE9 mais f\xE1cil de ver e ningu\xE9m se machuca. Quando conseguir fazer de olhos fechados, voc\xEA virou mestre! \u{1F3C6}"}]},montagens:{nome:"Montagens (como armar a linha)",emoji:"\u{1F527}",cor:"#FFD166",intro:"Montagem \xE9 o jeito de organizar chumbada, anzol, boia e isca na linha. Cada pescaria pede uma!",passos:[{t:"Chicote de fundo \u2014 praia e trapiche",art:"chicote",d:"Chumbada na PONTA da linha e anzol num 'galho' lateral. A chumbada segura tudo no fundo e a isca fica dan\xE7ando na correnteza. Perfeita para corvina, bagre e pampo com isca natural. Voc\xEA pode comprar o chicote pronto ou montar com n\xF3s uni."},{t:"Montagem com boia \u2014 ver a mordida",art:"boia",d:"Boia na linha, um chumbinho pequeno abaixo dela e o anzol na ponta. Quando a boia afundar ou sair andando... FISGA! \xD3tima para til\xE1pia na lagoa e peixe-espada no trapiche. A dist\xE2ncia entre boia e anzol \xE9 a profundidade que a isca fica."},{t:"Montagem para isca artificial",art:"artificial",d:"Linha principal \u2192 girador (evita a linha torcer) \u2192 um peda\xE7o de linha mais grossa (o l\xEDder, uns 50 cm) \u2192 snap \u2192 isca. O snap deixa trocar de isca rapidinho, sem fazer n\xF3 de novo. Para anchova e tra\xEDra, o l\xEDder precisa ser bem resistente por causa dos dentes!"},{t:"Iscando camar\xE3o vivo",art:"camarao",d:"Passe o anzol de leve na parte de tr\xE1s do camar\xE3o, perto do rabo, sem atingir a parte escura da cabe\xE7a (\xE9 o 'c\xE9rebro' dele). Assim ele continua nadando e chama o robalo. Arremesse suave para ele n\xE3o soltar."},{t:"Iscando minhoca e fil\xE9",d:"Minhoca: enfie o anzol pelo corpo dela deixando uma pontinha solta se mexendo. Fil\xE9 de peixe: corte uma tira fininha e passe o anzol 2 vezes, deixando a ponta do anzol levemente para fora para fisgar bem."},{t:"Tipos de chumbada (peso)",d:"CHUMBO BOLINHA: redondo, para fundo parado sem correnteza. CHUMBO OLIVA (corredi\xE7o): tem furo no meio, a linha desliza por dentro \u2014 o peixe puxa a isca sem sentir o peso, \xF3timo para robalo desconfiado. CHUMBO ESTRELA/GARRA: com 'pontas' que travam no fundo, para segurar em correnteza forte de canal ou praia com onda. CHUMBO DE FECHO R\xC1PIDO: prende e solta na hora, f\xE1cil de trocar o peso conforme a mar\xE9 muda."},{t:"Montagem fixa \xD7 montagem corredi\xE7a",d:"FIXA: o chumbo fica preso direto na linha (bom para arremessar longe e sentir a fisgada na hora). CORRIDA/CORREDI\xC7A: o chumbo (oliva) desliza livre at\xE9 um nozinho ou girador que trava \u2014 o peixe sente menos peso ao puxar a isca, \xF3timo para robalo e peixes desconfiados. Escolha pela esp\xE9cie: peixe el\xE9trico e desconfiado \u2192 corredi\xE7a; pesca de fundo parado \u2192 fixa."},{t:"Qual montagem usar?",d:"Peixe de fundo (corvina, bagre) \u2192 chicote. Ver a mordida com crian\xE7a (til\xE1pia, espada) \u2192 boia. Peixe ca\xE7ador (robalo, tra\xEDra, anchova) \u2192 artificial ou camar\xE3o vivo. Registre no Di\xE1rio qual montagem usou nas notas \u2014 a An\xE1lise vai mostrar a campe\xE3!"}]},av_praia:{nome:"Leitura de praia e mar",emoji:"\u{1F52D}",cor:"#073B4C",avancado:!0,intro:"Pescador avan\xE7ado n\xE3o arremessa em qualquer lugar: ele L\xCA a praia. Baseado nos tipos de pesqueiro descritos pelo Guia Floripa.",passos:[{t:"Os 4 tipos de pesqueiro de praia",d:"O Guia Floripa divide os pontos de praia em: PRAIAS RASAS (fundo suave, tipo Jurer\xEA e as ba\xEDas \u2014 peixes pequenos e m\xE9dios pertinho), PRAIAS DE TOMBO (o fundo despenca logo na beira, tipo trechos da Joaquina \u2014 peixe grande a poucos metros!), CANAIS DE PRAIA (valas fundas entre bancos de areia) e LAGAMARES (po\xE7as e bra\xE7os de \xE1gua calma atr\xE1s dos bancos)."},{t:"Como enxergar o canal",d:t.default.createElement(t.default.Fragment,null,"Olhe a arrebenta\xE7\xE3o: onde a onda QUEBRA \xE9 raso (banco de areia); onde a onda passa SEM quebrar e a \xE1gua fica mais escura e lisa, \xE9 fundo \u2014 o canal! O peixe usa o canal como estrada. Arremesse na beirada entre o raso e o fundo. Um ",t.default.createElement(Vi,{culta:"pescador experiente",manez:"pescador tri camarada"})," sempre repara nisso antes de escolher o ponto.")},{t:"O corredor entre bancos",d:"Viu duas \xE1reas de espuma com uma 'faixa calma' no meio? \xC9 um corredor: a \xE1gua que entra com as ondas volta para o mar por ali, carregando comida. Corvina, pampo e papa-terra ficam de boca aberta nessa esteira."},{t:"Mapeie na mar\xE9 baixa",d:"Truque de mestre: v\xE1 \xE0 praia na mar\xE9 bem baixa e FOTOGRAFE os bancos, valas e pedras que ficam expostos. Quando a mar\xE9 encher, voc\xEA saber\xE1 exatamente onde est\xE1 o fundo \u2014 enquanto os outros chutam, voc\xEA sabe."},{t:"Lendo o cost\xE3o",d:"No cost\xE3o, procure: pontas que avan\xE7am no mar (a correnteza dobra ali), espuma batendo na pedra (oxig\xEAnio + comida desgrudada = robalo e sargo), e canais entre pedras. Mar de ressaca = cost\xE3o PROIBIDO, sem exce\xE7\xE3o."},{t:"Onde cada praia da ilha se encaixa",d:"Praias compridas de mar aberto (Campeche, Mo\xE7ambique) = arremesso longo, tombo e canais. Ba\xEDas Norte e Sul (Beira-Mar, Ribeir\xE3o, Tapera) = rasas e calmas, perfeitas com crian\xE7as. P\xE2ntano do Sul = o principal porto pesqueiro da ilha, cultura viva. Barra da Lagoa = canal cl\xE1ssico."}]},av_equip:{nome:"Equipamento a fundo",emoji:"\u{1F52C}",cor:"#5a7684",avancado:!0,intro:"Linha, vara, anzol e freio t\xEAm ci\xEAncia. Entender isso \xE9 o pulo do peixe pequeno para o peixe grande.",passos:[{t:"Monofilamento \xD7 multifilamento",d:"MONO: mais barato, estica (amortece a briga), invis\xEDvel na \xE1gua \u2014 \xF3timo para come\xE7ar. MULTI: n\xE3o estica (voc\xEA sente TUDO), muito mais fino para a mesma for\xE7a \u2014 arremessa longe, mas precisa de l\xEDder e \xE9 vis\xEDvel. Regra: mono para isca natural parada, multi para isca artificial trabalhada."},{t:"O l\xEDder de fluorocarbono",d:"Um peda\xE7o de linha especial (50-80 cm) entre a linha principal e a isca: quase invis\xEDvel na \xE1gua e resistente a pedra e dente. Emenda com n\xF3 uni duplo. Para anchova e tra\xEDra de dent\xE3o, o l\xEDder \xE9 obrigat\xF3rio \u2014 ou voc\xEA perde a isca no primeiro ataque."},{t:"Vara: a\xE7\xE3o e libragem",d:"LIBRAGEM (ex.: 10-20 lb) = for\xE7a da linha que a vara aguenta. A\xC7\xC3O = onde ela dobra: R\xC1PIDA dobra s\xF3 na ponta (sens\xEDvel, fisgada seca \u2014 boa para artificial), LENTA dobra inteira (amortece \u2014 boa para isca natural e peixe de boca mole como a pescada)."},{t:"A regulagem cient\xEDfica do freio",d:"O freio deve liberar linha com cerca de 1/3 da for\xE7a de ruptura dela. Teste caseiro: amarre a linha num peso conhecido \u2014 ou pe\xE7a para algu\xE9m puxar com for\xE7a constante \u2014 e ajuste at\xE9 sair suave. Freio frouxo = n\xE3o fisga; freio travado = TCHAU linha no primeiro peix\xE3o."},{t:"Anzol c\xEDrculo \xD7 anzol J",d:"O anzol CIRCULAR fisga sozinho no canto da boca quando o peixe nada (n\xE3o precisa 'bicada' \u2014 s\xF3 recolher!) e quase nunca \xE9 engolido: perfeito para soltar o peixe vivo. O J cl\xE1ssico precisa da fisgada na hora certa. Para pesque-e-solte com crian\xE7as, c\xEDrculo \xE9 o campe\xE3o."},{t:"Cuidado com o material",d:"Depois de cada pescaria no mar: enx\xE1gue vara, molinete e iscas em \xE1gua DOCE (o sal destr\xF3i tudo), seque e pingue uma gotinha de \xF3leo na manivela de vez em quando. Linha exposta ao sol resseca \u2014 troque quando ficar \xE1spera ou esbranqui\xE7ada."}]},av_clima:{nome:"Clima e oceano a fundo",emoji:"\u{1F321}\uFE0F",cor:"#118AB2",avancado:!0,intro:"Para quem j\xE1 entendeu a Ci\xEAncia da Pesca b\xE1sica e quer o n\xEDvel laborat\xF3rio.",passos:[{t:"Siz\xEDgia \xD7 quadratura",d:"Mar\xE9 de SIZ\xCDGIA: na lua cheia e nova, Sol e Lua alinham e puxam juntos \u2014 mar\xE9s grandes, correnteza forte, peixes el\xE9tricos. Mar\xE9 de QUADRATURA: nos quartos, Sol e Lua puxam em \xE2ngulo e se atrapalham \u2014 mar\xE9s pequenas e pesca mais morna. O Pesc\xF4metro j\xE1 sabe disso, agora voc\xEA tamb\xE9m!"},{t:"Vento sul \xD7 nordeste em Floripa",d:"NORDESTE soprando dias seguidos: empurra \xE1gua quente para a costa, mar arrumado \u2014 bom para robalo e pampo no ver\xE3o. SUL chegando: \xE9 a frente fria \u2014 antes dele, o banquete (press\xE3o caindo!); durante, ressaca e perigo; depois, \xE1gua fria e revirada que pode trazer anchova e sargo. O vento conta a hist\xF3ria do tempo."},{t:"A termoclina",d:"Em lagoas e no mar parado, a \xE1gua forma camadas: quente em cima, fria embaixo, com uma 'parede' invis\xEDvel no meio (a termoclina). Os peixes ficam na profundidade da temperatura preferida deles. Se n\xE3o mordem em cima, des\xE7a a isca \u2014 pode ser que a festa esteja no andar de baixo."},{t:"Chuva, rio e a boca doce",d:"Depois de chover forte, os rios despejam \xE1gua doce, barrenta e cheia de comida no mar. A boca do rio vira um buf\xEA \u2014 robalo e tainha adoram. Mas \xE1gua doce DEMAIS espanta os peixes de mar: o segredo \xE9 pescar na 'linha de encontro' entre a \xE1gua barrenta e a \xE1gua limpa."},{t:"Teoria solunar",d:"Al\xE9m das mar\xE9s, existem os 'per\xEDodos solunares': janelas em que a Lua est\xE1 exatamente em cima ou embaixo de voc\xEA (per\xEDodos maiores) ou nascendo/se pondo (menores) \u2014 momentos em que os bichos do planeta inteiro ficam mais ativos. Quando um per\xEDodo solunar coincide com mar\xE9 boa e amanhecer... anota: dia hist\xF3rico."},{t:"Ressaca e ondula\xE7\xE3o",d:"Onda n\xE3o \xE9 s\xF3 vento local: ondula\xE7\xF5es viajam de tempestades a centenas de km (o 'swell'). Por isso pode dar mar grande num dia de sol e calmaria! SEMPRE confira a previs\xE3o de ondas no app antes de ir ao cost\xE3o \u2014 mar acima de 1,5 m, pesca de pedra cancelada."}]},nos_marinheiro:{nome:"N\xF3s de marinheiro",emoji:"\u2693",cor:"#118AB2",intro:"Esses n\xF3s n\xE3o s\xE3o pra linha fina de pescar \u2014 s\xE3o pra CORDA E CABO GROSSO: amarrar o barco, prender no trapiche, fixar coisas. Todo bom pescador de barco sabe pelo menos os primeiros!",passos:[{t:"Volta do Fiel \u2014 prender r\xE1pido numa estaca",art:null,d:"O jeito mais r\xE1pido de amarrar uma corda numa estaca, poste ou parte fina de um trapiche. 1) Passe a corda ao redor do poste. 2) Cruze por cima dela mesma e d\xEA outra volta. 3) Passe a ponta por baixo da \xFAltima volta e puxe. F\xE1cil de fazer e de desfazer \u2014 mas sozinho n\xE3o \xE9 o mais seguro para peso muito grande."},{t:"La\xE7o do Enforcado (bowline) \u2014 o n\xF3 mais importante de todos",d:"Cria um la\xE7o forte na ponta da corda que N\xC3O aperta quem ou o que estiver dentro dele, e mesmo assim \xE9 f\xE1cil de desfazer depois \u2014 at\xE9 depois de aguentar bastante peso. Serve pra resgate, pra prender uma bombona, pra i\xE7ar algo. 1) Fa\xE7a uma alcinha pequena na corda (o 'buraco da toca'). 2) A ponta 'sobe pela toca', 3) d\xE1 a volta por tr\xE1s da parte comprida da corda ('ao redor da \xE1rvore'), 4) e 'desce de volta pra dentro da toca'. Puxe firme pela parte grossa para fechar."},{t:"Volta do Cabo com Dois Cotes \u2014 amarrar o barco de vez",d:"O cl\xE1ssico para prender o barco num poste do trapiche ou numa argola firme, aguenta pux\xE3o forte e d\xE1 pra ajustar o tamanho depois. 1) D\xEA uma volta completa ao redor do poste ou argola (a 'volta do cabo'). 2) Com a ponta, fa\xE7a um 'cote' (um n\xF3 simples ao redor da parte principal da corda). 3) Fa\xE7a um segundo cote logo depois do primeiro, no mesmo sentido. Aperte bem os dois."},{t:"N\xF3 Direito \u2014 juntar duas cordas parecidas",d:"Serve pra juntar dois peda\xE7os de corda do MESMO grossor, ou pra amarrar um embrulho. 1) Cruze as duas pontas, uma por cima da outra. 2) Cruze de novo, mas dessa vez a que estava por cima passa por BAIXO. 3) Puxe as quatro pontas para apertar. Se ficou torto (virou um 'n\xF3 de vaca', que escorrega), alguma das cruzadas foi pro lado errado \u2014 desfa\xE7a e tente de novo."},{t:"N\xF3 de Escota \u2014 juntar cordas de grossuras diferentes",d:"Quando as duas cordas s\xE3o bem diferentes em grossura, o N\xF3 Direito n\xE3o seguraria \u2014 a\xED entra o N\xF3 de Escota. 1) Fa\xE7a um la\xE7o com a corda mais GROSSA. 2) Passe a ponta da corda mais FINA por dentro do la\xE7o, por baixo. 3) Enrole a fina ao redor das duas pernas do la\xE7o grosso. 4) Passe a ponta fina por baixo dela mesma e puxe para travar."},{t:"Margarida \u2014 encurtar corda sem cortar",d:"Um truque e tanto: encurta um peda\xE7o comprido de corda esticada, sem precisar cortar nem desperdi\xE7ar nada, e ainda d\xE1 pra desfazer rapidinho depois. 1) Dobre a corda formando 3 'S' seguidos, tipo uma sanfona. 2) Passe um la\xE7o pequeno atrav\xE9s de cada dobra nas pontas, prendendo-as no lugar. Pronto \u2014 a corda ficou mais curta e ainda aguenta peso leve nas al\xE7as formadas!"},{t:"N\xF3 do Carroceiro (talha) \u2014 apertar carga com for\xE7a extra",somenteAdulto:!0,d:"N\xF3 de mec\xE2nica: cria uma 'roldana' improvisada na pr\xF3pria corda, multiplicando sua for\xE7a para apertar uma carga bem firme (tipo amarrar algo pesado no barco ou no reboque). 1) Fa\xE7a um la\xE7o fixo no meio da corda. 2) Passe a ponta livre ao redor do ponto de fixa\xE7\xE3o e de volta pelo la\xE7o, puxando forte (\xE9 aqui que ganha for\xE7a extra). 3) Prenda com dois cotes simples pra travar. Pede pr\xE1tica \u2014 comecem treinando com corda fina em casa."},{t:"N\xF3 Ajust\xE1vel (n\xF3 de tenda) \u2014 regula sem desamarrar",somenteAdulto:!0,d:"Cria um la\xE7o que desliza pra ajustar a tens\xE3o, mas trava sozinho quando solto \u2014 \xF3timo pra amarrar toldo, barraca ou at\xE9 prender algo no barco em que a mar\xE9 vai mudar a altura da \xE1gua. 1) D\xEA duas voltas ao redor da parte principal da corda, por dentro do la\xE7o. 2) D\xEA mais uma volta por fora, mais perto da ponta. 3) Aperte: o n\xF3 desliza empurrando, mas trava puxando."},{t:"N\xF3 de Pescador Duplo \u2014 a emenda mais forte de todas",somenteAdulto:!0,d:"Apesar do nome, esse \xE9 pra CORDA (n\xE3o confundir com os n\xF3s de linha de pesca!) \u2014 uma das emendas mais fortes que existem, usada at\xE9 em alpinismo. 1) Sobreponha as duas cordas, uma do lado da outra, em sentidos opostos. 2) Com a ponta de uma, d\xEA duas voltas ao redor da outra corda e passe por dentro delas mesma. 3) Repita com a outra ponta, na outra corda. 4) Puxe as duas partes principais para os n\xF3s se encostarem e travarem um no outro."},{t:"N\xF3 Autoblocante (Prusik) \u2014 sobe e trava sozinho",somenteAdulto:!0,d:"Um nozinho feito com uma corda fina, enrolado ao redor de uma corda grossa: desliza f\xE1cil quando est\xE1 frouxo, mas trava sozinho quando puxado com peso. Usado em resgate e em alpinismo. 1) Passe um peda\xE7o de corda fina em volta da corda grossa, formando um la\xE7o. 2) Enrole esse la\xE7o 3 vezes ao redor da corda grossa, por dentro de si mesmo. 3) Ajeite as voltas paralelas e aperte \u2014 ele desliza na m\xE3o, mas trava sozinho com peso."},{t:"N\xF3 de Cabresto \u2014 prender algo rapidinho",somenteAdulto:!0,d:"Simples e r\xE1pido, bom pra prender uma bombona ou objeto num poste por um tempinho curto \u2014 mas n\xE3o \xE9 dos mais seguros pra peso grande ou muito tempo. 1) Passe a corda ao redor do poste ou objeto, cruzando por cima dela mesma. 2) D\xEA mais uma volta ao redor. 3) Passe a ponta por baixo da \xFAltima volta e puxe."}]},av_nos:{nome:"N\xF3s avan\xE7ados",emoji:"\u{1FAA2}",cor:"#8A6D00",avancado:!0,intro:"J\xE1 mandam bem no Clinch, no Palomar e no Uni? Hora de conhecer os n\xF3s que os pescadores mais experientes usam \u2014 cada um com uma fun\xE7\xE3o especial. As imagens oficiais, com a linha se movendo de verdade, est\xE3o no Portal Pesca Amadora (link em cada um).",passos:[{t:"N\xF3 de Sangue \u2014 emendar duas linhas parecidas",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_de_Sangue",label:"Ver no Portal Pesca Amadora"},d:"\xD3timo para juntar duas pontas de linha do MESMO grossor (tipo depois daquela cabeleira feia na carretilha!). 1) Segure as duas pontas juntas. 2) Enrole uma ponta v\xE1rias vezes ao redor da outra linha e traga de volta pelo meio; fa\xE7a o mesmo do outro lado. 3) Puxe as duas pontas em dire\xE7\xF5es opostas para fechar o n\xF3. S\xF3 funciona bem se as duas linhas forem parecidas em grossura."},{t:"N\xF3 Trilene \u2014 prender anzol, snap ou girador",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Trilene",label:"Ver no Portal Pesca Amadora"},d:"Quase n\xE3o deixa a linha perder for\xE7a \u2014 \xF3tima escolha para prender anzol, snap ou girador. 1) Passe a linha DUAS vezes pelo olhal. 2) D\xEA 4 ou 5 voltas ao redor da linha principal. 3) Passe a ponta de volta pelo arco que se formou perto do olhal. 4) Molhe, aperte bem devagar e apare a sobra."},{t:"N\xF3 Albright \u2014 o mais dif\xEDcil de todos",somenteAdulto:!0,ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Albright",label:"Ver no Portal Pesca Amadora"},d:"Fama de ser o n\xF3 mais complicado \u2014 s\xF3 tentem depois de dominar os outros! Serve para juntar linhas bem diferentes em grossura (tipo a linha principal com um l\xEDder de fluorcarbono grosso). Pede bastante paci\xEAncia e aten\xE7\xE3o pra puxar cada volta na ordem certa. Vale muito ver a imagem oficial passo a passo antes de tentar."},{t:"N\xF3 de Sangue Compensado \u2014 para linhas de grossuras diferentes",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_de_Sangue_Compensado",label:"Ver no Portal Pesca Amadora"},d:"\xC9 uma vers\xE3o ajustada do N\xF3 de Sangue. A diferen\xE7a: do lado da linha mais FINA, d\xE1-se mais voltas, para equilibrar o n\xF3. Assim ele funciona mesmo juntando linhas de grossuras diferentes, o que o N\xF3 de Sangue comum n\xE3o faz muito bem."},{t:"N\xF3 para iscas artificiais \u2014 mais movimento pra isca",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_para_Iscas_Artificiais",label:"Ver no Portal Pesca Amadora"},d:"Um la\xE7o que deixa a isca artificial se mexer mais livre na \xE1gua, ficando mais atrativa. 1) Passe a ponta pela argola do girador, com uma meia-volta antes. 2) Segure junto com a linha principal. 3) Gire o girador uns 6 vezes ao redor das duas linhas. 4) Aperte puxando a linha principal de um lado e o girador do outro \u2014 um alicate ajuda no aperto final."},{t:"N\xF3 para anzol com pata (sem olhal)",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_para_Empate_de_Anz\xF3is_com_Pata",label:"Ver no Portal Pesca Amadora"},d:"Alguns anz\xF3is tradicionais n\xE3o t\xEAm olhal, s\xF3 uma 'pata' reta \u2014 esse n\xF3 \xE9 feito pra eles. 1) Segure a linha junto \xE0 pata do anzol. 2) Enrole bem justinho a linha e a haste do anzol, v\xE1rias voltas seguidas. 3) Ajuste as voltas, molhe e aperte puxando as duas pontas em dire\xE7\xF5es opostas. Corte a sobra rente."},{t:"N\xF3 Homer Rhode Loop \u2014 isca com mais liberdade",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Homer_Rhode_Loop",label:"Ver no Portal Pesca Amadora"},d:"Cria um la\xE7o entre o n\xF3 e o anzol/isca, deixando ela se mexer mais solta na \xE1gua \u2014 atrai peixe curioso. Aguenta linha bem pesada, \xF3timo pra peixe grande. 1) Fa\xE7a uma meia-volta uns 10 cm antes da ponta, formando um la\xE7o; passe a linha pelo olhal. 2) Passe a ponta pelo la\xE7o e aperte de leve, encostando no anzol. 3) Fa\xE7a um segundo n\xF3 ao redor da linha principal, esse sim bem apertado. 4) Puxe a linha principal para juntar os dois n\xF3s perto do olhal. Uma gotinha de saliva ajuda a deslizar."},{t:"N\xF3 Oito \u2014 um freio simples na linha",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Oito",label:"Ver no Portal Pesca Amadora"},d:"Um n\xF3 simples em forma de '8', usado como travinha na ponta da linha. Quanto mais for\xE7a nas pontas, mais firme ele fica \u2014 mas continua f\xE1cil de desfazer depois, mesmo tendo segurado bastante peso."},{t:"N\xF3 Surgeon \u2014 outro jeito de emendar linhas",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#N\xF3_Surgeon",label:"Ver no Portal Pesca Amadora"},d:"Alternativa ao N\xF3 de Sangue pra juntar duas linhas \u2014 e funciona mesmo se elas forem bem diferentes em grossura. 1) Sobreponha as pontas das duas linhas por uns 8-10 cm. 2) Tratando as duas como se fossem uma linha s\xF3, fa\xE7a um n\xF3 simples, puxando tudo pelo la\xE7o. 3) Repita, formando um segundo n\xF3 no mesmo la\xE7o, sem apertar ainda. 4) Puxe as quatro pontas para fechar tudo junto. Apare bem rente pra n\xE3o prender nos passadores da vara."},{t:"Ring Knot \u2014 mais voltas, mais seguran\xE7a",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#Ring_Knot",label:"Ver no Portal Pesca Amadora"},d:"Parecido com o N\xF3 de Sangue, s\xF3 que com mais voltas \u2014 d\xE1 um pouco mais de trabalho pra fazer, mas segura muito bem e a linha praticamente n\xE3o escorrega."},{t:"N\xF3 para o carretel \u2014 prendendo a linha na carretilha/molinete",ref:{url:"https://www.pescamadora.com.br/nos-de-pesca/#No_Carretel",label:"Ver no Portal Pesca Amadora"},d:"\xC9 o primeiro n\xF3 de todos \u2014 prende a ponta da linha no carretel vazio, antes de encher o resto da bobina. 1) Dobre a ponta da linha formando um la\xE7o e d\xEA um n\xF3 de 3 voltas nele. 2) Abra a pega-linha do molinete (ou, na carretilha, passe a linha pelo carretel primeiro) e passe o la\xE7o ao redor do carretel. 3) Puxe a linha principal pra apertar o n\xF3 no carretel e corte a sobra."}]},av_estuario:{nome:"Estu\xE1rios, mangues e a Lagoa",emoji:"\u{1F33F}",cor:"#06D6A0",avancado:!0,intro:"Onde o rio encontra o mar mora a pesca mais rica da regi\xE3o. Com conhecimento compilado do iscabox.com.",passos:[{t:"O que \xE9 um estu\xE1rio",d:t.default.createElement(t.default.Fragment,null,"\xC9 o encontro do rio com o mar: \xE1gua salobra, mangue, lodo cheio de comida. \xC9 o BER\xC7\xC1RIO do oceano \u2014 ",t.default.createElement(Vi,{culta:"cardumes",manez:"mantas"})," de robalo, tainha, corvina e camar\xE3o crescem ali. As Ba\xEDas Norte e Sul da ilha s\xE3o cercadas de estu\xE1rios (Ratones, Cubat\xE3o, Bigua\xE7u, Tijucas).")},{t:"A regra de ouro do estu\xE1rio",d:"Como resume o pessoal do iscabox: a mar\xE9 define TUDO no estu\xE1rio. Mar\xE9 ENCHENDO: a \xE1gua invade o mangue e o robalo vai ca\xE7ar entre as ra\xEDzes. Mar\xE9 VAZANDO: todo mundo desce para o talude do canal (a 'escadinha' funda) \u2014 hora de corvina e pescada. Errou a mar\xE9, errou a pescaria."},{t:"Depois da chuva, espere clarear",d:"Chuva forte enche o estu\xE1rio de \xE1gua barrenta. A dica dos guias locais: espere uns 2 dias de tempo firme para a \xE1gua clarear \u2014 a\xED a pesca volta com tudo. \xC1gua cor de chocolate = dia de treinar n\xF3s em casa."},{t:"A boia de correr (t\xE9cnica de mestre)",d:"Diferente da boia fixa, a boia de correr desliza na linha at\xE9 um nozinho-limitador que VOC\xCA posiciona. Resultado: a isca fica na profundidade exata das pedras ou do canal. \xC9 a t\xE9cnica cl\xE1ssica para o marimb\xE1 no cost\xE3o e para a pescada no canal fundo."},{t:"A noite dos canais",d:"A pescada-branca \xE9 coruja: fica mais ativa do fim da tarde at\xE9 umas 23h e de novo na madrugada. Canal fundo + camar\xE3o + lanterna com luz baixinha = pescaria noturna inesquec\xEDvel (agasalho e adulto junto, claro)."},{t:"A Lagoa da Concei\xE7\xE3o",d:"Meio doce, meio salgada \u2014 um mundo pr\xF3prio no cora\xE7\xE3o da ilha. \xC9 a casa da CARAPEBA (a moedinha prateada), al\xE9m de robalo e tainha. Linha fina e respeito: a Lagoa \xE9 tamb\xE9m casa de muita gente que vive da pesca."},{t:"Expedi\xE7\xF5es da Grande Floripa",d:"Quando a fam\xEDlia quiser aventura fora da ilha: os estu\xE1rios do Rio Cubat\xE3o (Palho\xE7a), Bigua\xE7u e Tijucas s\xE3o cl\xE1ssicos \u2014 tainha de maio a agosto, robalo de setembro a mar\xE7o, sempre mandando na mar\xE9. O iscabox.com tem guias completos de cada um!"}]}},hg=["\u{1F9D2} Sempre pesque com um adulto por perto.","\u{1F9F4} Passe protetor solar e leve \xE1gua para beber.","\u{1FA9D} Anzol \xE9 afiado! Pe\xE7a ajuda para colocar iscas e tirar o peixe.","\u{1F30A} Em cost\xE3o de pedra, fique longe de onde a onda molha.","\u{1F41F} Peixe pequeno demais? Devolva para a \xE1gua crescer!","\u{1F4CF} Respeite os tamanhos m\xEDnimos e \xE9pocas de defeso (pergunte a um adulto)."],gg=[{termo:"Olheiro",cat:"pesca",sig:"Pescador que fica no cost\xE3o ou no alto do morro vigiando o mar para avisar quando o cardume de tainha chega \u2014 antigamente com panos e apito, hoje com r\xE1dio.",ex:'"\xD3, o olheiro j\xE1 t\xE1 acenando l\xE1 de cima \u2014 cardume chegando!"'},{termo:"Vigia",cat:"pesca",sig:"Outro nome para o olheiro: quem fica de olho no mar.",ex:'"Bota o vigia l\xE1 na pedra, que a tainha t\xE1 pra descer."'},{termo:"Remeiro",cat:"pesca",sig:"Quem rema a canoa na pescaria de cerco \u2014 geralmente 4 por canoa, os mais fortes da equipe.",ex:'"Sou remeiro desde guri, aprendi com meu av\xF4."'},{termo:"Bucheiro",cat:"pesca",sig:"Pescador embarcado que solta e monta a rede na \xE1gua, fechando o cerco no cardume.",ex:'"O bucheiro jogou a rede certinho, cercou tudo."'},{termo:"Livreteiro",cat:"pesca",sig:"O 'tesoureiro' da equipe: anota quanto peixe foi pego e como reparte entre todos.",ex:'"Pergunta pro livreteiro quanto deu de tainha hoje."'},{termo:"Companha",cat:"pesca",sig:"A equipe inteira de pescadores que trabalha junto numa pescaria de cerco, dividindo tarefas e resultado.",ex:'"A companha inteira foi pra praia de madrugada."'},{termo:"Cerco",cat:"pesca",sig:"A t\xE9cnica de rodear o cardume com a rede at\xE9 fechar a sa\xEDda \u2014 o cora\xE7\xE3o da pesca da tainha.",ex:'"Deu praia de fazer o cerco, o mar tava mar ch\xE3o."'},{termo:"Manta",cat:"pesca",sig:"Um cardume visto na superf\xEDcie da \xE1gua, uma 'mancha' escura se movendo.",ex:'"\xD3ia a manta ali perto da pedra, \xE9 peixe grande."'},{termo:"Boiada",cat:"pesca",sig:"Outro jeito de chamar um cardume grande de peixe.",ex:'"Passou uma boiada de tainha ali agora de manh\xE3."'},{termo:"Tainhada",cat:"pesca",sig:"Uma grande pescaria de tainha, com fartura \u2014 o dia em que a rede vem cheia.",ex:'"Foi uma tainhada, meu, nunca vi tanto peixe!"'},{termo:"Mac\xF4a",cat:"pesca",sig:"Tainha f\xEAmea grande, cheia de ova \u2014 a mais desejada da safra.",ex:'"Pegamos uma mac\xF4a enorme hoje de manh\xE3."'},{termo:"Nisquinha",cat:"pesca",sig:"Uma quantidade pequena de peixe \u2014 quando o lan\xE7o n\xE3o rendeu muito.",ex:'"Hoje s\xF3 deu uma nisquinha, mas valeu o passeio."'},{termo:"Ora\xE7a",cat:"pesca",sig:"A ondinha que se forma na \xE1gua parada quando um peixe salta ou uma pedra cai \u2014 o 'sinal' na superf\xEDcie.",ex:'"Viu a ora\xE7a ali? Deve ter peixe saltando perto."'},{termo:"Nordest\xE3o",cat:"pesca",sig:"Vento nordeste bem forte \u2014 de olho no Pesc\xF4metro quando ele avisar!",ex:'"T\xE1 ventando um nordest\xE3o, hoje n\xE3o d\xE1 pra sair de canoa."'},{termo:"Mar ch\xE3o",cat:"pesca",sig:"Mar bem calmo, liso, sem ondas \u2014 dia \xF3timo para o cerco.",ex:'"Amanheceu um mar ch\xE3o, d\xE1 pra sair tranquilo."'},{termo:"Mar azul",cat:"pesca",sig:"A parte do mar com \xE1gua mais limpa e azulzinha, diferente da \xE1gua barrenta perto da costa.",ex:'"O peixe bom t\xE1 l\xE1 no mar azul, mais pra fora."'},{termo:"Canoa de um pau s\xF3",cat:"pesca",sig:"A canoa tradicional a\xE7oriana, feita de um tronco inteiro s\xF3, entalhada \xE0 m\xE3o \u2014 s\xEDmbolo da pesca da Ilha.",ex:'"Meu bisav\xF4 fazia canoa de um pau s\xF3, era um artista\xE7o."'},{termo:"Poita",cat:"pesca",sig:"\xC2ncora r\xFAstica de pedra amarrada com corda, usada nas canoas antigas para segurar no lugar.",ex:'"Solta a poita aqui, que o fundo t\xE1 bom."'},{termo:"Fateixa",cat:"pesca",sig:"Uma pequena \xE2ncora de ferro com 'garras', usada para prender embarca\xE7\xF5es pequenas.",ex:'"Joga a fateixa perto da pedra, devagar."'},{termo:"Lestada",cat:"pesca",sig:"O vento mais temido pelos pescadores antigos da Ilha: vento forte do mar (leste), deixa o mar violento e pode durar 14-15 dias seguidos em agosto, com chuva miudinha.",ex:'"Vish, deu lestada \u2014 quinze dia de mar de risco pela frente!"'},{termo:"Terral",cat:"pesca",sig:"Vento que sopra da terra para o mar, bem gelado, trazendo at\xE9 o cheiro do mangue. Era comum d\xE9cadas atr\xE1s; hoje quase n\xE3o aparece mais.",ex:'"Ventou terral hoje, trouxe um friozinho e uma catinga de mangue."'},{termo:"Naroeste",cat:"pesca",sig:"Forma antiga de dizer 'noroeste'. Vento raro na Ilha \u2014 costuma dar s\xF3 uma ou duas vezes por ano, geralmente em agosto.",ex:'"Faz tempo que n\xE3o d\xE1 um naroeste por aqui."'},{termo:"Mar de dentro",cat:"pesca",sig:"As ba\xEDas Norte e Sul da Ilha, \xE1gua calma entre a Ilha e o continente \u2014 onde vivem os pescadores de ba\xEDa.",ex:'"Eu sou pescador do mar de dentro, n\xE3o enfrento o mar grosso."'},{termo:"Mar de fora",cat:"pesca",sig:"O oceano aberto, na costa leste da Ilha \u2014 mar mais bravo, dos pescadores de praia e mar aberto.",ex:'"O mar de fora hoje t\xE1 bravo, melhor ficar pro lado de dentro."'},{termo:"Mar riscado",cat:"pesca",sig:"Quando o mar est\xE1 calmo mas cai uma chuvinha fina \u2014 sinal de que a lestada est\xE1 chegando ou j\xE1 passou.",ex:'"\xD3ia o mar riscado ali, vem lestada de novo."'},{termo:"Bah",cat:"geral",sig:"Interjei\xE7\xE3o de espanto, surpresa ou emo\xE7\xE3o \u2014 serve para quase tudo!",ex:'"Bah, que peixe grande!"'},{termo:"Dazamunho",cat:"geral",sig:"Express\xE3o de espanto bem forte, tipo 'nossa senhora'.",ex:'"Dazamunho, que cardum\xE3o passou ali!"'},{termo:"Guri / Guria",cat:"geral",sig:"Menino / menina.",ex:'"Vem c\xE1, guri, olha o n\xF3 que ensinei!"'},{termo:"Home",cat:"geral",sig:"Forma carinhosa (ou de espanto) de chamar algu\xE9m, tipo 'cara' ou 'meu'.",ex:'"Home, tu pescou isso sozinho?"'},{termo:"Boc\xF3",cat:"geral",sig:"Bobo, distra\xEDdo \u2014 sempre de brincadeira entre amigos.",ex:'"N\xE3o s\xEA boc\xF3, olha o anzol antes de arremessar!"'},{termo:"Deu poste",cat:"geral",sig:"N\xE3o deu certo, 'furou' o plano.",ex:'"Fomos pescar de tarde, mas deu poste \u2014 s\xF3 vento."'},{termo:"Mix\xF3rdia",cat:"geral",sig:"Bagun\xE7a, confus\xE3o.",ex:'"A linha ficou uma mix\xF3rdia depois do arremesso."'},{termo:"Bulir",cat:"geral",sig:"Mexer, remexer em alguma coisa.",ex:'"N\xE3o bule na caixa de isca, deixa quietinha a\xED."'},{termo:"Bujulas",cat:"geral",sig:"'Coisa nenhuma', nada \u2014 usado pra dizer que n\xE3o tinha nada em algum lugar.",ex:'"Fomos no ponto de sempre e n\xE3o tinha bujulas de peixe."'},{termo:"B\xFAzio",cat:"geral",sig:"Um redemoinho de vento \u2014 vento que gira e levanta poeira ou areia.",ex:'"\xD3 o b\xFAzio levantando areia l\xE1 na praia!"'},{termo:"Dar uma banda",cat:"geral",sig:"Dar uma volta, passear por a\xED.",ex:'"Bora dar uma banda na Barra antes de ir pra casa?"'},{termo:"Tri",cat:"geral",sig:"Muito, bacana \u2014 usado pra dar \xEAnfase em qualquer coisa boa.",ex:'"Foi tri legal pescar com o vov\xF4 hoje!"'}],vg=[{id:"pesca",nome:"\u{1F3A3} Gente e coisas da pescaria"},{id:"geral",nome:"\u{1F4AC} Jeito de falar da Ilha"}];function bg(){let[a,e]=(0,t.useState)(""),[o,i]=(0,t.useState)(null),[r,n]=(0,t.useState)(null),l=gg.filter(s=>(!o||s.cat===o)&&(!a||s.termo.toLowerCase().includes(a.toLowerCase())||s.sig.toLowerCase().includes(a.toLowerCase())));return t.default.createElement("div",null,t.default.createElement(D,{style:{ s (siz\xEDgia) = peixes ativos.","\u{1F30A} A melhor mar\xE9 \xE9 a que se MEXE (enchendo ou vazando) \u2014 esteira de comida ligada.","\u{1F388} Press\xE3o do ar caindo = frente fria vindo = peixes comem muito antes da chuva.","\u{1F550} O banquete dos peixes \xE9 no amanhecer e no entardecer; c\xE9u nublado deixa todos corajosos.","\u{1F41F} Tainha se pesca com tarrafa; robalo tem a linha preta lateral; linguado tem os 2 olhos do mesmo lado.","\u{1F99E} Corrupto mora em buracos na areia da mar\xE9 baixa \u2014 isca campe\xE3 das praias.","\u26A1 Anchova tem dentes: l\xEDder/empate resistente obrigat\xF3rio.","\u{1F420} Corvina puxa devagar primeiro: espere firmar antes de fisgar.","\u{1F980} A coca \xE9 o 'elevador de siri': isca no fundo e puxada r\xE1pida para cima."]},mestre:{guias:["av_praia","av_equip","av_clima"],extra:"Releia com calma \u2014 as perguntas do Mestre v\xEAm todas dos tr\xEAs guias avan\xE7ados.",resumo:["\u26F0\uFE0F Praia de TOMBO: o fundo despenca na beira \u2014 peixe grande perto, mar forte.","\u{1F52D} O canal aparece onde a onda N\xC3O quebra e a \xE1gua escurece; mapeie a praia na mar\xE9 baixa.","\u{1F315} Siz\xEDgia = lua cheia e nova; quadratura = quartos (mar\xE9s fracas).","\u{1F9F5} Multifilamento n\xE3o estica (sente tudo, pede l\xEDder); mono estica e amortece.","\u2699\uFE0F Freio regulado para liberar com ~1/3 da for\xE7a da linha.","\u2B55 Anzol circular fisga sozinho no canto da boca \u2014 perfeito para soltar o peixe.","\u{1F4A8} Nordeste dias seguidos = \xE1gua quente e mar arrumado; sul = frente fria chegando.","\u{1F321}\uFE0F Termoclina: a 'parede' entre a \xE1gua quente de cima e a fria de baixo.","\u{1F327}\uFE0F Ap\xF3s chuva, pesque na linha de encontro entre a \xE1gua barrenta e a limpa.","\u{1F30A} Swell \xE9 ondula\xE7\xE3o que viaja de longe \u2014 mar grande pode vir em dia de sol.","\u{1F9F4} Depois do mar: material enxaguado em \xE1gua DOCE e seco."]},lenda:{guias:["av_nos","av_estuario","colheita_do_mar","av_praia","av_equip","av_clima"],extra:"N\xEDvel insano: decore tamb\xE9m a R\xE9gua do Pescador (n\xFAmeros!) e a ficha do marimb\xE1 e da carapeba na aba Iscas.",resumo:["\u{1F33F} Estu\xE1rio na ENCHENTE: robalo ca\xE7a nas ra\xEDzes do mangue; na VAZANTE: corvina e pescada no talude do canal.","\u{1F327}\uFE0F Ap\xF3s chuvarada, o estu\xE1rio volta a produzir ap\xF3s ~2 dias de tempo firme (\xE1gua clareia).","\u{1F319} Pescada-branca: ativa do entardecer at\xE9 ~23h e na madrugada.","\u{1F38B} Marimb\xE1: bicada curta e nervosa \u2192 multifilamento fino + fluorocarbono fino.","\u{1F388} Boia de CORRER desliza at\xE9 um n\xF3-limitador: isca na profundidade exata das pedras.","\u{1F4D0} 'Comprimento total' oficial: do focinho \xE0 ponta da nadadeira caudal mais alongada.","\u{1F4CF} Decoreba de lenda: robalo-peba 30 cm, robalo-flexa 50 cm, espada 70 cm, tainha 35 cm.","\u2696\uFE0F Toler\xE2ncia na fiscaliza\xE7\xE3o: 10% (Anexo I) e 20% (Anexo II) do peso da captura.","\u{1F318} Solunar: per\xEDodos MAIORES = Lua no z\xEAnite/nadir; menores = nascer e p\xF4r da Lua.","\u{1FA99} Carapeba \xE9 a esp\xE9cie-s\xEDmbolo da Lagoa da Concei\xE7\xE3o.","\u{1F5FA}\uFE0F Ba\xEDa Sul = mais aberta ao oceano (pesca mais 'de mar') que a Ba\xEDa Norte.","\u{1F578}\uFE0F Caceio usa a mar\xE9 para levar a rede; fundeio \xE9 o mais simples de todos; batuque espanta o peixe com barulho.","\u{1F41A} A Resex do Pirajuba\xE9 foi a primeira reserva extrativista MARINHA do Brasil, criada por causa do berbig\xE3o."]},doce_iniciante:{guias:["agua_doce","pesque_pague"],extra:"Releia tamb\xE9m as fichas de carpa, pacu, tambaqui, lambari, car\xE1, jundi\xE1 e truta na aba Iscas (filtro \u{1F3DE}\uFE0F \xC1gua doce)!",resumo:["\u{1F3DE}\uFE0F Rio, lagoa e cachoeira N\xC3O t\xEAm mar\xE9 \u2014 quem manda \xE9 a correnteza (rio) ou a calmaria (lagoa).","\u{1F319} Lua, press\xE3o, vento e hor\xE1rio continuam valendo igual ao mar.","\u{1FAA8} No rio, o peixe fica atr\xE1s de pedras/troncos, onde a \xE1gua corre mais devagar.","\u{1F4A6} Cachoeira: o po\xE7o (beirada da queda) \xE9 o point \u2014 mais oxig\xEAnio na \xE1gua.","\u{1F327}\uFE0F Depois de chuva forte, o rio sobe r\xE1pido e fica barrento \u2014 espere clarear.","\u{1FAB1} Minhoca e massa resolvem quase tudo; milho \xE9 campe\xE3o para carpa/pacu/tambaqui.","\u{1F308} Truta s\xF3 vive em \xE1gua fria \u2014 por isso \xE9 criada em pesque-pagues de serra.","\u{1F3AB} Pesque-pague: cobran\xE7a por quilo ou entrada fixa; anzol geralmente sem fisga; isca de massa liberada, isca viva de peixe geralmente proibida.","\u{1F41F} No pesque-pague, o peixe fisgado geralmente \xE9 o que voc\xEA paga e leva."]},doce_mestre:{guias:["agua_doce","pesque_pague","av_clima"],extra:"Reveja a Ci\xEAncia da Pesca e o Clima avan\xE7ado \u2014 muita coisa da \xE1gua doce \xE9 uma vers\xE3o adaptada desses guias!",resumo:["\u{1F30A} A correnteza \xE9 a 'mar\xE9' de \xE1gua doce: organiza onde a comida passa.","\u{1F4A6} Queda d'\xE1gua mistura oxig\xEAnio no po\xE7o \u2014 por isso os peixes se concentram ali.","\u{1F321}\uFE0F Lagos tamb\xE9m t\xEAm camadas de temperatura, parecido com a termoclina do mar.","\u{1F327}\uFE0F Chuva na nascente pode subir o rio horas depois, mesmo com sol no seu ponto.","\u{1F3A3} Carpa \xE9 desconfiada: linha fina, anzol pequeno e muita paci\xEAncia.","\u267B\uFE0F Fora do pesque-pague, soltar peixe de \xE1gua doce (pesque-e-solte) ajuda a conserva\xE7\xE3o.","\u{1F4CF} Regras de tamanho m\xEDnimo de \xE1gua doce variam MUITO por estado/regi\xE3o \u2014 sempre confirme.","\u{1F308} Truta precisa de \xE1gua fria e oxigenada, tipo rio de serra corrente.","\u{1F41F} Tambaqui/pacu adoram fruta e semente; dentes fortes parecidos com os nossos."]}},Hf=[{id:"conferir_caixa",txt:"\u{1F9F0} Conferir a caixa de pesca: anz\xF3is, chumbadas, linha \u2014 o que est\xE1 faltando?"},{id:"lista_compras",txt:"\u{1F6D2} Fazer a listinha do que precisa comprar para a pr\xF3xima pescaria"},{id:"separa
